<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Essential Engine - Buy It Right</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="../public/favicon.ico" />
  </head>
  <body
    class="min-h-screen overflow-x-hidden bg-white sm:max-h-dvh sm:min-h-dvh sm:overflow-hidden"
  >
    <div
      class="hidden min-h-screen w-full flex-col justify-start overflow-x-hidden pt-5 sm:min-h-auto sm:w-384 sm:origin-top-left sm:justify-center sm:overflow-hidden sm:py-0"
      id="app-wrapper"
    >
      <div
        class="mb-6 flex items-center justify-start px-5 sm:absolute sm:top-0 sm:left-0 sm:mt-10 sm:ml-10 sm:mb-0 sm:w-full sm:justify-end sm:px-0"
      >
        <img
          src="../public/eelogo.png"
          alt="eelogo"
          class="max-w-32 sm:max-w-48"
        />
        <div class="-mt-5 mr-4 hidden h-0.5 flex-1 bg-[#FB2C37] sm:block"></div>
      </div>
      <section class="relative sm:static sm:m-0">
        <div
          class="top-0 z-10 flex h-22 w-full max-w-[calc(100%-1em)] items-center justify-center bg-[#0389A0] p-4 not-only:absolute sm:absolute sm:right-0 sm:h-40 sm:w-190 sm:p-10"
        >
          <h1 class="text-left text-3xl font-bold text-white sm:text-6xl">
            Buy It Right Guarantee
          </h1>
        </div>
        <div
          class="top-5 right-0 z-0 mt-5 h-22 w-full bg-[#F0592B] sm:absolute sm:left-auto sm:mt-0 sm:h-43 sm:w-200"
        ></div>
      </section>
      <main class="relative pt-5 flex-1 sm:flex-none px-5 sm:pb-0 sm:pt-32">
        <section
          class="relative z-10 flex flex-col-reverse items-center justify-center gap-8 sm:flex-row sm:gap-10"
        >
        <img
            src="https://ags.s3.amazonaws.com/2019/GuaranteeStamp.png"
            alt="Award Announcement"
            class="max-w-92"
          />
          <div class="flex w-full flex-col sm:w-[50%]">
            <ul class="ml-6 list-disc text-lg font-light sm:text-3xl">
              <li>Five full days from today to receive a full refund</li>
              <li>Upgrades and downgrades available with no change fees</li>
              <li>
                No hassles! Simply let us know you want to make a return using
                our Buy It Right Guarantee!
              </li>
            </ul>
          </div>
        </section>
      </main>
    </div>

    <script>
      function scalePage() {
        const baseWidth = 1536;
        const scale = window.innerWidth / baseWidth;

        const wrapper = document.getElementById("app-wrapper");
        const isDesktopLayout = window.innerWidth >= 640;

        if (isDesktopLayout) {
          wrapper.style.transform = "scale(" + scale + ")";
          wrapper.style.height = `${(1 / scale) * 100}vh`;
        } else {
          wrapper.style.transform = "none";
          wrapper.style.height = "auto";
        }

        wrapper.style.display = "flex";
      }

      window.addEventListener("resize", scalePage);
      window.addEventListener("load", scalePage);
    </script>
  </body>
</html>
