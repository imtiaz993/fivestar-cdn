<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Essential Engine - I don't want to have a profile in the magazine
    </title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="../public/favicon.ico" />
  </head>
  <body
    class="min-h-screen overflow-x-hidden bg-white sm:max-h-dvh sm:min-h-dvh sm:overflow-hidden"
  >
    <div
      id="clip-path"
      class="absolute top-0 left-0 hidden h-16 w-16 bg-[#F0592B] sm:fixed sm:h-40 sm:w-40"
      style="clip-path: polygon(0 0, 100% 0, 0 100%)"
    ></div>

    <div
      id="clip-path-2"
      class="absolute top-0 right-0 hidden h-16 w-16 bg-[#0389A0] sm:fixed sm:h-40 sm:w-40"
      style="clip-path: polygon(100% 0, 100% 100%, 0 0)"
    ></div>
    <div
      class="hidden min-h-screen w-full flex-col justify-start overflow-x-hidden py-5 sm:min-h-auto sm:w-384 sm:origin-top-left sm:justify-center sm:overflow-hidden sm:py-0"
      id="app-wrapper"
    >
      <!-- <img
        src="../public/eelogo.png"
        alt="Essential Engine logo"
        class="max-w-32 mr-auto ml-8 sm:absolute sm:top-0 sm:left-0 sm:mt-10 sm:mb-0 sm:ml-40 sm:max-w-48"
      /> -->
      <img
        src="../public/eelogo.png"
        alt="Essential Engine logo"
        class="mb-5 ml-10 max-w-32 font-medium text-wrap mr-auto sm:absolute sm:top-0 sm:right-0 sm:mt-10 sm:mb-0 sm:mr-40 sm:max-w-48"
      />
      <section
        class="relative z-10 w-full bg-[#0389A0] px-5 py-5 text-white shadow-md shadow-black sm:absolute sm:top-6 sm:left-25 sm:max-w-150 sm:px-7 sm:py-6"
      >
        <div class="flex gap-4">
          <div class="border-2 border-white sm:border-4"></div>
          <div class="space-y-1">
            <h1 class="text-start text-3xl text-white sm:text-6xl">
              Marketing Tools
            </h1>
          </div>
        </div>
      </section>
      <main class="relative flex flex-1 items-center sm:flex-none sm:pb-0">
        <section
          class="mx-auto flex w-full max-w-screen-2xl flex-col px-5 sm:px-10 sm:pt-8"
        >
          <p
            class="mt-8 sm:mt-0 mx-auto max-w-full text-center text-xl font-medium sm:text-3xl"
          >
            Tools That Fit Your Approach to Marketing and Your Business
            Objectives
          </p>
          <div
            class="mt-10 flex flex-col gap-10 text-black sm:mt-12 sm:flex-row sm:items-start sm:justify-between sm:gap-8"
          >
            <div class="flex w-full flex-col gap-8 sm:w-[47%]">
              <div class="grid gap-8 sm:grid-cols-2 sm:gap-10">
                <article class="flex flex-col items-center">
                  <h2 class="mb-4 font-normal text-center text-lg sm:text-xl">
                    Magazine Appearance
                  </h2>
                  <img
                    src="../public/RE26_MagazineAppearance.png"
                    alt="Magazine appearance examples"
                    class="w-full max-w-lg"
                  />
                  <p
                    class="mt-5 max-w-md text-center leading-tight text-sm sm:text-base"
                  >
                    85% of Profile Buyers Repeat Each Year
                  </p>
                </article>

                <article class="flex flex-col items-center">
                  <h2 class="mb-4 font-normal text-center text-lg sm:text-xl">
                    Managed Social Media
                  </h2>
                  <img
                    src="../public/RE26_MS_SocialMedia.png"
                    alt="Managed social media examples"
                    class="w-full max-w-md"
                  />
                </article>
              </div>
            </div>

            <div
              class="w-full border-[3px] border-[#7a7a7a] px-4 py-5 sm:w-[48%] sm:px-8 sm:py-6"
            >
              <div class="grid gap-8 sm:grid-cols-2 sm:gap-6">
                <article class="flex flex-col items-center">
                  <h2
                    class="mb-4 max-w-[360px] text-center font-normal text-lg leading-tight sm:text-xl"
                  >
                    Digital Award Announcement Tools
                  </h2>
                  <img
                    src="../public/RE26_DigitalTools.png"
                    alt="Digital award announcement tools"
                    class="w-full max-w-lg"
                  />
                </article>

                <article class="flex flex-col items-center">
                  <h2
                    class="mb-4 max-w-[360px] text-center font-normal text-lg leading-tight sm:text-xl"
                  >
                    Display/marketing Tools
                  </h2>
                  <img
                    src="../public/RE26_DisplayTools.png"
                    alt="Display marketing tools"
                    class="w-full max-w-md"
                  />
                </article>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script>
      function scalePage() {
        const baseWidth = 1536;
        const scale = window.innerWidth / baseWidth;

        const wrapper = document.getElementById("app-wrapper");
        const clipPath = document.getElementById("clip-path");
        const clipPath2 = document.getElementById("clip-path-2");
        const isDesktopLayout = window.innerWidth >= 640;

        if (isDesktopLayout) {
          wrapper.style.transform = "scale(" + scale + ")";
          wrapper.style.height = `${(1 / scale) * 100}vh`;
        } else {
          wrapper.style.transform = "none";
          wrapper.style.height = "auto";
        }

        wrapper.style.display = "flex";
        clipPath.style.display = "block";
        clipPath2.style.display = "block";
      }

      window.addEventListener("resize", scalePage);
      window.addEventListener("load", scalePage);
    </script>
  </body>
</html>
