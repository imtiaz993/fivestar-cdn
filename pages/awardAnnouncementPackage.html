<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Essential Engine - Announcement Package</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="../public/favicon.ico" />
  </head>

  <body
    class="min-h-screen overflow-x-hidden bg-white sm:max-h-dvh sm:min-h-dvh sm:overflow-hidden"
  >
    <div
      id="clip-path"
      class="absolute top-0 left-0 hidden h-60 w-34 bg-[#F0592B] sm:h-full sm:w-[26%]"
      style="clip-path: polygon(0 0, 70% 0, 0% 100%, 0 100%)"
    ></div>
    <div
      class="hidden flex-col justify-start py-5 sm:w-384 sm:origin-top-left sm:p-0"
      id="app-wrapper"
    >
      <img
        src="../public/eelogo.png"
        alt="Essential Engine logo"
        class="mb-6 ml-auto mr-5 w-32 sm:fixed sm:top-0 sm:right-0 sm:mt-10 sm:mr-10 sm:mb-0 sm:w-48"
      />
      <section
        class="relative z-10 w-full bg-[#0389A0] px-5 py-5 text-white shadow-md shadow-black sm:absolute sm:top-6 sm:left-25 sm:max-w-220 sm:px-7 sm:py-6"
      >
        <div class="flex gap-4">
          <div class="border-2 border-white sm:border-4"></div>
          <div class="space-y-1">
            <h1 class="text-start text-3xl text-white sm:text-6xl">
              Announcement Package: $455
            </h1>
          </div>
        </div>
      </section>

      <main class="flex flex-1 items-center justify-center px-5 sm:px-0">
        <section
          class="mx-auto w-full max-w-7xl px-0 sm:px-8 sm:py-8"
        >
          <div
            class="mt-8 flex flex-col gap-8 sm:mt-12 sm:flex-row sm:items-start sm:justify-center sm:gap-12"
          >
            <div class="w-full pt-0 mx-auto sm:w-[36%] sm:pt-10">
              <ul
                class="pl-6 text-xl leading-snug font-light list-disc sm:pl-8 sm:text-2xl"
              >
                <li>Associate your brand with a premier publication</li>
              </ul>

              <div class="mt-4 sm:mt-6">
                <p class="text-xl font-medium sm:text-2xl">Includes:</p>
                <ul
                  class="mt-3 pl-6 text-lg leading-snug font-light list-disc sm:mt-4 sm:pl-8 sm:text-2xl"
                >
                  <li>Listing in publication</li>
                  <li>Listing e-reprint</li>
                  <li>Emblem</li>
                </ul>
              </div>
            </div>

            <div class="w-full space-y-8 sm:w-[50%] sm:space-y-10 font-light">
              <div>
                <img
                  src="https://ags.s3.amazonaws.com/2026/re/RE26_Listing.png"
                  alt="Sample listing"
                  class="w-full"
                />
                <p class="mt-3 text-lg text-black text-center sm:text-left sm:mt-4 sm:text-2xl">
                  Sample listing
                </p>
              </div>

              <div
                class="flex flex-col gap-8 sm:flex-row sm:items-start sm:gap-8"
              >
                <div class="w-full">
                  <img
                    src="https://ags.s3.amazonaws.com/2026/re/RE26_Emblem.png"
                    alt="Sample emblem"
                    class="w-full sm:w-[20rem]"
                  />
                  <p class="mt-3 text-lg text-black text-center sm:text-left sm:mt-4 sm:text-2xl">
                    Sample emblem
                  </p>
                </div>

                <div class="w-full">
                  <img
                    src="https://ags.s3.amazonaws.com/2026/re/RE26_EReprint_Listing.png"
                    alt="Sample listing e-reprint"
                    class="w-full border border-gray-300 bg-white p-1 shadow-sm sm:w-[22rem]"
                  />
                  <p class="mt-3 text-lg text-black text-center sm:text-left sm:mt-4 sm:text-2xl">
                    Sample listing e-reprint
                  </p>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script>
      function scalePage() {
        const baseWidth = 1536;
        const scale = window.innerWidth / baseWidth;

        const wrapper = document.getElementById("app-wrapper");
        const clipPath = document.getElementById("clip-path");
        const isDesktopLayout = window.innerWidth >= 640;

        if (isDesktopLayout) {
          wrapper.style.transform = "scale(" + scale + ")";
          wrapper.style.height = `${(1 / scale) * 100}vh`;
        } else {
          wrapper.style.transform = "none";
          wrapper.style.height = "auto";
        }

        wrapper.style.display = "flex";
        clipPath.style.display = "block";
      }

      window.addEventListener("resize", scalePage);
      window.addEventListener("load", scalePage);
    </script>
  </body>
</html>
