<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: "Roboto", Arial, sans-serif;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "Lato", Arial, sans-serif;
      }
    </style>
    <title>Essential Engine - Congratulations</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="./js/confetti.browser.min.js"></script>
    <link rel="shortcut icon" href="../public/favicon.ico" />
  </head>
  <body
    class="min-h-screen overflow-x-hidden bg-[#0E1B3B] sm:max-h-dvh sm:min-h-dvh sm:overflow-hidden"
  >
    <div
      id="app-wrapper"
      class="hidden min-h-screen w-full items-center justify-center py-8 sm:min-h-auto sm:w-384 sm:origin-top-left sm:py-0"
    >
      <section class="w-full text-white">
        <div class="flex flex-col justify-between sm:min-h-0">
          <div class="flex flex-1 items-center justify-center">
            <div class="w-full space-y-6 sm:space-y-8 sm:px-10">
              <h1
                class="text-center text-4xl leading-none font-bold sm:text-9xl"
              >
                Congratulations!
              </h1>

              <div class="max-w-4xl mx-auto relative z-50">
                <div class="relative z-50 w-full bg-[#F0592B] px-4 py-5 sm:p-6">
                  <p
                    class="text-center text-xl leading-8 font-extralight sm:text-4xl"
                  >
                    You have been officially certified as a
                    <br class="hidden sm:block" />
                    <span class="font-bold uppercase">
                      2026 FIVE STAR REAL ESTATE AGENT
                    </span>
                  </p>
                </div>

                <div
                  class="absolute top-1/2 left-1/2 z-0 h-16 w-[92%] -translate-x-1/2 -translate-y-1/2 border-2 border-white sm:h-20 sm:w-260 sm:border-3"
                ></div>
              </div>

              <h2 class="text-center text-2xl font-semibold sm:text-6xl">
                5 YEAR WINNER
              </h2>
            </div>
          </div>

          <div class="absolute bottom-0 left-0 mb-10 ml-4 py-4 sm:ml-10">
            <img
              src="../public/eelogo.png"
              alt="awardlogo"
              class="max-w-32 sm:mx-0 sm:max-w-48"
            />
          </div>
        </div>
      </section>
    </div>

    <script>
      function scalePage() {
        const baseWidth = 1536;
        const scale = window.innerWidth / baseWidth;
        const wrapper = document.getElementById("app-wrapper");
        const isDesktopLayout = window.innerWidth >= 640;

        if (isDesktopLayout) {
          wrapper.style.transform = "scale(" + scale + ")";
          wrapper.style.height = `${(1 / scale) * 100}vh`;
        } else {
          wrapper.style.transform = "none";
          wrapper.style.height = "auto";
        }

        wrapper.style.display = "flex";
      }

      function runCongratulationsConfetti() {
        const count = 400;

        const defaults = {
          origin: { x: 0.5, y: 0.65 },
          gravity: 0.5,
          ticks: 300,
        };

        function fire(particleRatio, opts) {
          confetti(
            Object.assign({}, defaults, opts, {
              particleCount: Math.floor(count * particleRatio),
            }),
          );
        }

        fire(0.25, {
          spread: 26,
          startVelocity: 55,
        });

        fire(0.2, {
          spread: 60,
        });

        fire(0.35, {
          spread: 100,
          decay: 0.91,
          scalar: 0.8,
        });

        fire(0.1, {
          spread: 120,
          startVelocity: 25,
          decay: 0.92,
          scalar: 1.2,
        });

        fire(0.1, {
          spread: 120,
          startVelocity: 45,
        });
      }

      window.addEventListener("resize", scalePage);

      window.addEventListener("load", () => {
        scalePage();

        setTimeout(() => {
          runCongratulationsConfetti();
        }, 1000);
      });
    </script>
  </body>
</html>
