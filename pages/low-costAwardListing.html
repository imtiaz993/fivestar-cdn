<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: "Roboto", Arial, sans-serif;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "Lato", Arial, sans-serif;
      }
    </style>
    <title>Essential Engine - Low Cost Listing Only Package</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="../public/favicon.ico" />
  </head>

  <body
    class="min-h-screen overflow-x-hidden bg-white sm:max-h-dvh sm:min-h-dvh sm:overflow-hidden"
  >
    <div
      id="clip-path"
      class="absolute top-0 left-0 hidden h-60 w-34 bg-[#F0592B] sm:h-full sm:w-[26%]"
      style="clip-path: polygon(0 0, 70% 0, 0% 100%, 0 100%)"
    ></div>
    <div
      class="hidden flex-col justify-start py-5 sm:w-384 sm:origin-top-left sm:p-0"
      id="app-wrapper"
    >
      <img
        src="../public/eelogo.png"
        alt="Essential Engine logo"
        class="mr-5 mb-6 ml-auto w-32 sm:fixed sm:top-0 sm:right-0 sm:mt-10 sm:mr-10 sm:mb-0 sm:w-48"
      />
      <section
        class="relative z-10 w-full bg-[#0389A0] px-5 py-5 text-white shadow-md shadow-black sm:absolute sm:top-6 sm:left-25 sm:max-w-190 sm:px-7 sm:py-6"
      >
        <div class="flex gap-4">
          <div class="border-2 border-white sm:border-4"></div>
          <div class="space-y-1">
            <h1 class="text-start text-3xl text-white sm:text-6xl">
              Listing Package: $195
            </h1>
          </div>
        </div>
      </section>

      <main class="flex flex-1 items-center justify-center px-5 sm:px-0">
        <section class="w-full max-w-6xl px-0 py-4 text-black sm:px-8 sm:py-8">
          <div
            class="mt-8 flex w-full flex-col justify-center gap-8 sm:mt-12 sm:flex-row sm:items-start sm:gap-12"
          >
            <div
              class="w-full space-y-10 pt-4 sm:w-[46%] sm:space-y-12 sm:pt-8"
            >
              <h1 class="text-center text-2xl sm:text-start sm:text-2xl">
                Listing in San Diego Magazine
              </h1>
              <div class="w-full space-y-3">
                <img
                  src="../public/awardannouncement2.png"
                  alt="Sample emblem"
                  class="w-full sm:w-[20rem]"
                />
                <p
                  class="mt-3 text-center text-lg font-light text-black sm:mt-4 sm:text-start sm:text-xl"
                >
                  Associate your brand with San Diego Magazine
                </p>
              </div>
            </div>

            <div class="w-full space-y-8 sm:w-[50%] sm:space-y-10">
              <div>
                <p
                  class="mt-3 text-center text-2xl font-light text-black sm:mt-4 sm:text-start sm:text-2xl"
                >
                  Sample listing:
                </p>
                <img
                  src="https://ags.s3.amazonaws.com/2026/re/RE26_Listing.png"
                  alt="Sample listing"
                  class="w-full"
                />
              </div>
              <div class="w-full space-y-3">
                <p
                  class="mt-3 text-center text-2xl font-light text-black sm:mt-4 sm:text-start sm:text-2xl"
                >
                  Sample listing e-reprint
                </p>
                <img
                  data-modal-open="sample-modal-1"
                  src="https://ags.s3.amazonaws.com/2026/re/RE26_EReprint_Listing.png"
                  alt="Sample listing e-reprint"
                  class="w-full cursor-pointer border border-gray-300 bg-white p-1 shadow-sm sm:w-88"
                />
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <div
      id="sample-modal-1"
      data-modal
      class="fixed inset-0 z-50 hidden items-center justify-center overflow-y-auto bg-black/70 px-4 py-6 sm:px-8"
      aria-hidden="true"
    >
      <div
        data-modal-panel
        class="relative my-auto w-full max-w-6xl rounded-lg bg-white px-4 py-4 shadow-2xl sm:px-6 sm:py-6"
        role="dialog"
        aria-modal="true"
        aria-labelledby="sample-modal-title-1"
      >
        <button
          data-modal-close
          type="button"
          class="absolute -top-3 -right-3 flex h-10 w-10 cursor-pointer items-center justify-center rounded-full border border-[#d9e2e8] bg-white text-2xl leading-none text-[#0B5F8A] shadow-md"
          aria-label="Close modal"
        >
          ×
        </button>

        <div>
          <img
            src="https://ags.s3.amazonaws.com/2026/re/RE26_Reprint_Listing_Page.png"
            alt="Sample listing e-reprint 1"
            class="w-full"
          />
          <img
            src="https://ags.s3.amazonaws.com/2026/re/RE26_Reprint_Article_Page.png"
            alt="Sample listing e-reprint 2"
            class="w-full"
          />
        </div>
      </div>
    </div>
    <script>
      function scalePage() {
        const baseWidth = 1536;
        const scale = window.innerWidth / baseWidth;

        const wrapper = document.getElementById("app-wrapper");
        const clipPath = document.getElementById("clip-path");
        const modalPanels = document.querySelectorAll("[data-modal-panel]");
        const isDesktopLayout = window.innerWidth >= 640;

        if (isDesktopLayout) {
          wrapper.style.transform = "scale(" + scale + ")";
          wrapper.style.height = `${(1 / scale) * 100}vh`;

          modalPanels.forEach((panel) => {
            panel.style.transform = "none";
            panel.style.zoom = scale;
          });
        } else {
          wrapper.style.transform = "none";
          wrapper.style.height = "auto";

          modalPanels.forEach((panel) => {
            panel.style.zoom = "1";
            panel.style.transform = "none";
          });
        }

        wrapper.style.display = "flex";
        clipPath.style.display = "block";
      }

      function openModal(modal) {
        modal.classList.remove("hidden");
        modal.classList.add("flex");
        modal.setAttribute("aria-hidden", "false");
        document.body.classList.add("overflow-hidden");
      }

      function closeModal(modal) {
        modal.classList.add("hidden");
        modal.classList.remove("flex");
        modal.setAttribute("aria-hidden", "true");

        const openModals = document.querySelectorAll("[data-modal].flex");
        if (openModals.length === 0) {
          document.body.classList.remove("overflow-hidden");
        }
      }

      document.querySelectorAll("[data-modal-open]").forEach((button) => {
        button.addEventListener("click", () => {
          const modalId = button.getAttribute("data-modal-open");
          const modal = document.getElementById(modalId);
          if (modal) openModal(modal);
        });
      });

      document.querySelectorAll("[data-modal]").forEach((modal) => {
        const panel = modal.querySelector("[data-modal-panel]");

        modal.querySelectorAll("[data-modal-close]").forEach((button) => {
          button.addEventListener("click", () => closeModal(modal));
        });

        modal.addEventListener("click", (event) => {
          if (!panel.contains(event.target)) {
            closeModal(modal);
          }
        });
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          document.querySelectorAll("[data-modal].flex").forEach((modal) => {
            closeModal(modal);
          });
        }
      });

      window.addEventListener("resize", scalePage);
      window.addEventListener("load", scalePage);
    </script>
  </body>
</html>
